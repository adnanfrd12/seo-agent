<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFF6F2"/>
      <stop offset="1" stop-color="#FBE3D8"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A0B"/>
      <stop offset="0.5" stop-color="#FF4A1F"/>
      <stop offset="1" stop-color="#E0102E"/>
    </linearGradient>
    <linearGradient id="hotUse" gradientUnits="userSpaceOnUse" x1="90" y1="120" x2="420" y2="420">
      <stop offset="0" stop-color="#FF9A0B"/>
      <stop offset="0.55" stop-color="#FF4A1F"/>
      <stop offset="1" stop-color="#E0102E"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>

  <!-- bars -->
  <rect x="98" y="292" width="82" height="123" rx="17" fill="url(#hot)"/>
  <rect x="200" y="247" width="82" height="168" rx="17" fill="url(#hot)"/>
  <rect x="301" y="189" width="92" height="140" rx="17" fill="url(#hot)"/>

  <!-- rising arrow -->
  <path d="M102 248 Q 262 226 360 120" fill="none" stroke="url(#hotUse)" stroke-width="22" stroke-linecap="round"/>
  <path d="M330 92 L398 70 L401 140 Z" fill="url(#hotUse)" stroke="url(#hotUse)" stroke-width="12" stroke-linejoin="round"/>

  <!-- magnifier: white halo separates it from the tall bar -->
  <circle cx="356" cy="337" r="62" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="22"/>
  <circle cx="356" cy="337" r="55" fill="#FFFFFF" stroke="#1E2638" stroke-width="24"/>
  <path d="M398 380 L438 420" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round"/>
  <path d="M398 380 L438 420" stroke="#1E2638" stroke-width="30" stroke-linecap="round"/>
  <path d="M327 342 A 30 30 0 0 1 358 309" fill="none" stroke="#FF5A1F" stroke-width="10" stroke-linecap="round"/>
</svg>
